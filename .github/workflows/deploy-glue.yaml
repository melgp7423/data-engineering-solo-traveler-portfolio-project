name: CI/CD - Glue Jobs

on:
  push:
    branches: [main]
    paths:
      - "src/transformation/transform_combine_airplane_hotel_destination_datasets/**"
      - "tests/transformation/test_transform_combine_airplane_hotel_destination_datasets.py"
      - "src/load/load_gold_layer/**"
      - "tests/load/test_load_gold_layer.py"
      - ".github/workflows/deploy-glue.yaml"
  pull_request:
    branches: [main]
    paths:
      - "src/transformation/transform_combine_airplane_hotel_destination_datasets/**"
      - "tests/transformation/test_transform_combine_airplane_hotel_destination_datasets.py"
      - "src/load/load_gold_layer/**"
      - "tests/load/test_load_gold_layer.py"
      - ".github/workflows/deploy-glue.yaml"
  workflow_dispatch: # manual run deploys both glue jobs

env:
  AWS_REGION: us-east-2
  SCRIPT_FILE: handler.py

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: &glue_jobs
        include:
          - name: transform_combine_airplane_hotel_destination_datasets
            job_dir: src/transformation/transform_combine_airplane_hotel_destination_datasets
            test_file: tests/transformation/test_transform_combine_airplane_hotel_destination_datasets.py
            job_secret: AWS_TRANSFORM_COMBINE_AIRPLANE_HOTEL_DESTINATION_DATASETS_GLUE_JOB
          - name: load_gold_layer
            job_dir: src/load/load_gold_layer
            test_file: tests/load/test_load_gold_layer.py
            job_secret: AWS_LOAD_GOLD_LAYER_GLUE_JOB
    env:
      JOB_DIR: ${{ matrix.job_dir }}
      TEST_FILE: ${{ matrix.test_file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest
          if [ -s "$JOB_DIR/requirements.txt" ]; then
            pip install -r "$JOB_DIR/requirements.txt"
          fi

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          if [ ! -f "$TEST_FILE" ]; then
            echo "No test file at $TEST_FILE, skipping"
            exit 0
          fi
          pytest "$TEST_FILE" || [ $? -eq 5 ]

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: *glue_jobs
    env:
      JOB_DIR: ${{ matrix.job_dir }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy ${{ matrix.name }} to Glue
        env:
          JOB_NAME: ${{ secrets[matrix.job_secret] }}
        run: |
          if [ -z "$JOB_NAME" ]; then
            echo "::error::No Glue job name - add the ${{ matrix.job_secret }} repository secret"
            exit 1
          fi
          JOB_NAME="${JOB_NAME##*:job/}" # accept a bare job name or an ARN
          SCRIPT_LOCATION=$(aws glue get-job --job-name "$JOB_NAME" \
            --query 'Job.Command.ScriptLocation' --output text)
          if [[ "$SCRIPT_LOCATION" != s3://* ]]; then
            echo "::error::Glue job $JOB_NAME has no S3 script location (got '$SCRIPT_LOCATION')"
            exit 1
          fi
          # Keep a copy per commit next to the live script so a deploy can be rolled back
          aws s3 cp "$JOB_DIR/$SCRIPT_FILE" "${SCRIPT_LOCATION%/*}/history/${{ github.sha }}/$SCRIPT_FILE"
          aws s3 cp "$JOB_DIR/$SCRIPT_FILE" "$SCRIPT_LOCATION"
          echo "Deployed $SCRIPT_FILE to $SCRIPT_LOCATION for Glue job $JOB_NAME"
